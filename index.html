<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Proxy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Proxy</h1>
    <p class="subtitle">Open a URL through your proxy server.</p>

    <form id="proxyForm" class="bar">
      <input id="urlInput" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com" aria-label="URL" required>
      <button type="submit">Go</button>
    </form>

    <div class="actions">
      <button id="blankButton" type="button">Open in about:blank</button>
      <button id="backButton" type="button">Back</button>
      <button id="forwardButton" type="button">Forward</button>
      <button id="reloadButton" type="button">Reload</button>
    </div>

    <p id="status" class="status" role="status"></p>
    <iframe id="viewer" title="Proxied page" referrerpolicy="no-referrer"></iframe>
  </main>
  <script src="app.js"></script>
</body>
</html>
